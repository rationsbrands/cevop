name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cevop_test
          POSTGRES_USER: cevop
          POSTGRES_PASSWORD: testpassword
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://cevop:testpassword@localhost:5432/cevop_test
      DIRECT_URL: postgresql://cevop:testpassword@localhost:5432/cevop_test
      JWT_SECRET: test-secret-64-chars-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      ACCESS_TOKEN_SECRET: test-access-64-chars-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run migrations on test DB
        run: npx prisma migrate deploy --schema=server/src/prisma/schema.prisma

      - name: Run tests
        run: npm run test -w cevop-server

      - name: TypeScript check
        run: npx tsc --noEmit -p server/tsconfig.json

      - name: Lint
        run: npx eslint server/src --max-warnings 0

  build:
    name: Build check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:all