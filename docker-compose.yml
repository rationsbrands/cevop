version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cevop-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cevop
      POSTGRES_USER: cevop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - '5435:5432'
    volumes:
      - cevop_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cevop']
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cevop-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cevop:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/cevop
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      NODE_ENV: production
      PORT: 4000
      CUSTOMER_PWA_URL: http://localhost:5173
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  cevop_postgres_data:
